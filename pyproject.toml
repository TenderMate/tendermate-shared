[project]
name = "tendermate-shared"
version = "0.4.5"
description = "Shared gRPC proto definitions + agent scaffolding for TenderMate services"
requires-python = ">=3.10"
dependencies = [
    "grpclib>=0.4.7",
    "betterproto>=2.0.0b7",
    # Shared agent scaffolding (tendermate_shared.agents) + observability helpers. The OTel API is
    # tiny and a no-op without an SDK: the metrics facade, LLM callback and gRPC telemetry use it.
    "langchain-core>=0.3",
    "pydantic>=2",
    "opentelemetry-api>=1.45.2",
]

[project.optional-dependencies]
# Telemetry export: tendermate_shared.observability.telemetry (OTLP to tm-obs, runtime metrics,
# Pyroscope) and Sentry capture in report_handled_issue / the metrics facade. Without it,
# reporting degrades to a log line and metrics go nowhere.
observability = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-system-metrics>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pyroscope-io>=1.4.0",
    "sentry-sdk>=2.68.0",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.62.0",
    "betterproto[compiler]>=2.0.0b7",
    "ruff>=0.8.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# src-layout: the package code lives in src/ but is imported as `tendermate_shared`, so map the
# import name onto src/ (the modules — agents/grpc/observability — sit directly under src/). Must
# list packages explicitly: `find` would discover them as top-level `agents`/`grpc`/… without the
# `tendermate_shared` prefix. Add new grpc subpackages here when the proto grows.
[tool.setuptools]
package-dir = { "tendermate_shared" = "src" }
packages = [
    "tendermate_shared",
    "tendermate_shared.agents",
    "tendermate_shared.observability",
    "tendermate_shared.grpc",
    "tendermate_shared.grpc.tendermate",
    "tendermate_shared.grpc.tendermate.agent",
    "tendermate_shared.grpc.tendermate.agent.v1",
]

[tool.setuptools.package-data]
tendermate_shared = ["proto/*.proto", "py.typed"]
"tendermate_shared.agents" = ["py.typed"]
"tendermate_shared.observability" = ["py.typed"]

[tool.ruff]
line-length = 100
exclude = ["src/grpc/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
