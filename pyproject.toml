[project]
name = "tendermate-shared"
version = "0.1.0"
description = "Shared gRPC contracts for TenderMate services"
requires-python = ">=3.10"
dependencies = [
    "betterproto>=2.0.0b7",
    "grpclib>=0.4.7",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.62.0",
    "betterproto[compiler]>=2.0.0b7",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
