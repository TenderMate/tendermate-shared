[project]
name = "tendermate-shared"
version = "0.1.0"
description = "Shared gRPC proto definitions for TenderMate services"
requires-python = ">=3.10"
dependencies = [
    "grpclib>=0.4.7",
    "betterproto>=2.0.0b7",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.62.0",
    "betterproto[compiler]>=2.0.0b7",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tendermate_shared*"]

[tool.setuptools.package-data]
tendermate_shared = ["proto/*.proto"]

[tool.ruff]
line-length = 100
exclude = ["tendermate_shared/grpc/**"]
