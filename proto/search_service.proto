syntax = "proto3";

package tendermate.agent.v1;

// ─── Service ──────────────────────────────────────────────────────────────────

service SearchService {
  // Backend sends one request, agent streams back one SearchEvent per state
  // change: a ProductStarted when a product enters the pipeline, and a
  // MatchResult when it finishes. Events for a product are ordered started→result.
  rpc SearchProducts(SearchRequest) returns (stream SearchEvent);

  // Cancel a running job. Returns immediately; the job stops asynchronously.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
}

// ─── Input ────────────────────────────────────────────────────────────────────

message Product {
  string id          = 1;
  string name        = 2;
  string description = 3;
  int32  quantity    = 4;
  string unit        = 5;
}

message SearchRequest {
  string            job_id   = 1;
  repeated Product  products = 2;
}

// ─── Output ───────────────────────────────────────────────────────────────────

message AnalysisRecord {
  string candidate_url  = 1;
  string candidate_name = 2;
  bool   matched        = 3;
  float  confidence     = 4;
  string reason         = 5;
}

// Emitted when a product enters the active processing pipeline (proxy slot
// acquired). Carries only the id — there is no match data yet.
message ProductStarted {
  string product_id = 1;
}

message MatchResult {
  string                  product_id   = 1;
  bool                    matched      = 2;
  string                  etm_url      = 3;
  string                  etm_name     = 4;
  float                   etm_price    = 5;
  string                  etm_sku      = 6;
  float                   confidence   = 7;
  string                  ai_reasoning = 8;
  repeated AnalysisRecord ai_analyses  = 9;
}

// A single event on the SearchProducts stream: exactly one of the variants.
message SearchEvent {
  oneof event {
    ProductStarted started = 1;
    MatchResult    result  = 2;
  }
}

// ─── Cancellation ─────────────────────────────────────────────────────────────

message CancelJobRequest  { string job_id      = 1; }
message CancelJobResponse { bool   was_running = 1; }
