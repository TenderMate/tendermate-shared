syntax = "proto3";

package tendermate.agent.v1;

// ─── Service ──────────────────────────────────────────────────────────────────

service SearchService {
  // Backend sends one request, agent streams back one SearchEvent per state
  // change: a ProductStarted when a product enters the pipeline, and a
  // MatchResult when it finishes. Events for a product are ordered started→result.
  rpc SearchProducts(SearchRequest) returns (stream SearchEvent);

  // Cancel a running job. Returns immediately; the job stops asynchronously.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
}

// ─── Input ────────────────────────────────────────────────────────────────────

message Product {
  string id          = 1;
  string name        = 2;
  string description = 3;
  int32  quantity    = 4;
  string unit        = 5;
}

message SearchRequest {
  string            job_id   = 1;
  repeated Product  products = 2;
}

// ─── Output ───────────────────────────────────────────────────────────────────

message AnalysisRecord {
  string candidate_url    = 1;
  string candidate_name   = 2;
  bool   matched          = 3;
  float  confidence       = 4;
  string reason           = 5;
  bool   identifier_match = 6;  // tender article/model deterministically equals the candidate's
  // Jev check of the tender key parameters (0..1, confirmed share of stated ones); unset = not validated
  optional float validation_score = 7;
  // From the candidate's product page (like MatchResult.etm_price/etm_sku) so a human can pick a
  // non-winning candidate without losing them; 0 / "" = unknown (page not loaded).
  float  price = 8;
  string sku   = 9;
  // ETM sale terms of the candidate's page (price is per 1 price_unit); "" / 0 / [] = unknown
  // (page not loaded, or an agent older than these fields).
  string                  price_unit       = 10;
  double                  order_multiple   = 11;  // order multiple in price_unit ("Заказ по 100 м")
  repeated UnitConversion unit_conversions = 12;
}

// How many sale units (the record's price_unit, ETM "edizm") are in 1 `name` unit, e.g. ETM sells
// cable by "м": {name: "км", multiplier: 1000}; EKF ties by "упак": {name: "шт", multiplier: 0.01}.
message UnitConversion {
  string name       = 1;
  double multiplier = 2;
  string source     = 3;  // "etm" (packUnits) | "specs" (Количество в упаковке) | "name" (ETM name)
}

// Emitted when a product enters the active processing pipeline (proxy slot
// acquired). Carries only the id — there is no match data yet.
message ProductStarted {
  string product_id = 1;
}

message MatchResult {
  string                  product_id   = 1;
  bool                    matched      = 2;
  string                  etm_url      = 3;
  string                  etm_name     = 4;
  float                   etm_price    = 5;
  string                  etm_sku      = 6;
  float                   confidence   = 7;
  string                  ai_reasoning = 8;
  repeated AnalysisRecord ai_analyses  = 9;
  string                  category     = 10;
  bool                    error        = 11;  // true if the per-product search raised an error
  // ETM sale terms of etm_url (etm_price is per 1 etm_price_unit); "" / 0 / [] = unknown (no
  // page, or an agent older than these fields).
  string                  etm_price_unit       = 12;
  double                  etm_order_multiple   = 13;  // order multiple in etm_price_unit
  repeated UnitConversion etm_unit_conversions = 14;
}

// A single event on the SearchProducts stream: exactly one of the variants.
message SearchEvent {
  oneof event {
    ProductStarted started = 1;
    MatchResult    result  = 2;
  }
}

// ─── Cancellation ─────────────────────────────────────────────────────────────

message CancelJobRequest  { string job_id      = 1; }
message CancelJobResponse { bool   was_running = 1; }
